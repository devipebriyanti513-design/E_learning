<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f2937">
    <title>Profil Siswa - E-Learning SMA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f6f8; color: #222; }
        .container { max-width: 500px; min-height: 100vh; margin: auto; background: #fff; padding: 20px 20px 100px; }
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .back { text-decoration: none; color: #222; font-size: 24px; }
        .back:focus-visible, .bottom-menu a:focus-visible, .logout:focus-visible { outline: 3px solid #64748b; outline-offset: 3px; }
        h1 { font-size: 24px; }
        .profile-card { text-align: center; border: 1px solid #e5e7eb; border-radius: 15px; padding: 28px 20px; margin-bottom: 18px; }
        .avatar { font-size: 60px; margin-bottom: 12px; }
        .name { font-size: 22px; font-weight: bold; margin-bottom: 5px; overflow-wrap: anywhere; }
        .class-label { color: #666; }
        .info-card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .info-title { color: #666; font-size: 12px; margin-bottom: 5px; }
        .info-value { font-size: 16px; font-weight: bold; }
        .activity-summary { color: #444; line-height: 1.5; }
        .logout { width: 100%; border: 0; display: block; text-align: center; text-decoration: none; background: #dc2626; color: #fff; padding: 14px; border-radius: 10px; margin-top: 20px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .logout:hover { background: #b91c1c; }
        .bottom-menu { position: fixed; z-index: 10; right: 0; bottom: 0; left: 0; width: 100%; max-width: 500px; margin: auto; background: #fff; border-top: 1px solid #ddd; display: flex; justify-content: space-around; padding: 7px 0 calc(7px + env(safe-area-inset-bottom)); }
        .bottom-menu a { flex: 1; text-decoration: none; color: #555; text-align: center; padding: 4px 0; }
        .bottom-menu a[aria-current="page"] { color: #111827; font-weight: bold; }
        .menu-icon { display: block; font-size: 20px; }
        .menu-label { font-size: 11px; }
        .error { color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 12px; line-height: 1.5; }
        .error[hidden] { display: none; }
            /* Ukuran frame seragam untuk semua halaman e-learning */
        .app, .container {
            width: min(100%, 626px);
            max-width: 626px;
            min-height: 100vh;
            margin-left: auto;
            margin-right: auto;
        }
        .bottom-menu { max-width: 626px; }
        @media (max-width: 626px) {
            .app, .container { width: 100%; max-width: 100%; }
            .bottom-menu { max-width: 100%; }
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="header">
            <a href="dashboard.html" class="back" aria-label="Kembali ke dashboard">←</a>
            <h1>👤 Profil Siswa</h1>
        </header>

        <section class="profile-card" aria-label="Identitas siswa">
            <div class="avatar" aria-hidden="true">👤</div>
            <h2 id="namaProfil" class="name">Siswa</h2>
            <p class="class-label">Kelas X SMA</p>
        </section>

        <section class="info-card">
            <p class="info-title">MATA PELAJARAN</p>
            <p class="info-value">📐 Matematika</p>
        </section>

        <section class="info-card">
            <p class="info-title">KELAS</p>
            <p class="info-value">X SMA</p>
        </section>

        <section class="info-card">
            <p class="info-title">AKTIVITAS BELAJAR</p>
            <p class="info-value activity-summary" id="aktivitas">Memuat status…</p>
        </section>

        <p class="error" id="errorMessage" role="alert" hidden></p>
        <button class="logout" id="logoutButton" type="button">🚪 KELUAR</button>
    </main>

    <nav class="bottom-menu" aria-label="Navigasi utama">
        <a href="dashboard.html">
            <span class="menu-icon" aria-hidden="true">🏠</span>
            <span class="menu-label">Home</span>
        </a>
        <a href="mapel.html">
            <span class="menu-icon" aria-hidden="true">📚</span>
            <span class="menu-label">Materi</span>
        </a>
        <a href="progress.html">
            <span class="menu-icon" aria-hidden="true">📊</span>
            <span class="menu-label">Progress</span>
        </a>
        <a href="profil.html" aria-current="page">
            <span class="menu-icon" aria-hidden="true">👤</span>
            <span class="menu-label">Profil</span>
        </a>
    </nav>

    <script>
        (function () {
            const activityGroups = [
                ["absensiPertemuan1", "tugasPertemuan1", "quizPertemuan1"],
                ["absensiPertemuan2", "tugasPertemuan2", "quizPertemuan2"],
                ["absensiPertemuan3", "tugasPertemuan3", "quizPertemuan3"]
            ];

            try {
                const nama = (localStorage.getItem("namaSiswa") || "").trim();
                if (!nama) {
                    window.location.replace("index.html");
                    return;
                }
                document.getElementById("namaProfil").textContent = nama;
                const selesai = activityGroups.filter(function (group) {
                    return group.every(function (key) {
                        return Boolean(localStorage.getItem(key));
                    });
                }).length;
                document.getElementById("aktivitas").textContent =
                    selesai + " dari " + activityGroups.length + " kegiatan selesai";
            } catch (error) {
                const message = document.getElementById("errorMessage");
                message.textContent = "Data profil tidak dapat dibaca dari browser.";
                message.hidden = false;
            }

            document.getElementById("logoutButton").addEventListener("click", function () {
                try {
                    localStorage.removeItem("namaSiswa");
                    window.location.replace("index.html");
                } catch (error) {
                    const message = document.getElementById("errorMessage");
                    message.textContent = "Tidak dapat keluar karena penyimpanan browser bermasalah.";
                    message.hidden = false;
                }
            });
        })();
    </script>
</body>
</html>
