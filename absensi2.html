<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f2937">
    <title>Absensi Pertemuan 2 - E-Learning SMA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f6f8; color: #222; }
        .container { max-width: 500px; min-height: 100vh; margin: auto; background: #fff; padding: 20px 20px 32px; }
        .back { display: inline-block; color: #374151; text-decoration: none; font-size: 14px; }
        .back:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #64748b; outline-offset: 3px; }
        h1 { margin-top: 18px; font-size: 24px; }
        .subtitle { color: #666; margin-top: 5px; margin-bottom: 20px; line-height: 1.5; }
        .info { background: #f1f5f9; padding: 15px; border-radius: 10px; margin-bottom: 20px; line-height: 1.7; font-size: 14px; }
        .form-box { border: 1px solid #ddd; border-radius: 12px; padding: 18px; }
        .field-label, fieldset legend { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="text"] { width: 100%; padding: 13px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; margin-bottom: 20px; }
        input[readonly] { background: #f3f4f6; color: #444; }
        fieldset { border: 0; min-width: 0; margin-bottom: 20px; }
        .radio-option { display: flex; align-items: center; background: #f8fafc; border: 1px solid #ddd; padding: 13px; margin-top: 8px; border-radius: 8px; cursor: pointer; }
        .radio-option:hover { background: #f1f5f9; }
        .radio-option input { margin-right: 10px; width: 18px; height: 18px; accent-color: #1f2937; }
        button { width: 100%; border: 0; background: #1f2937; color: #fff; padding: 14px; border-radius: 9px; font-size: 15px; font-weight: bold; cursor: pointer; }
        button:hover { background: #111827; }
        button:disabled { opacity: .65; cursor: not-allowed; }
        .message { padding: 16px; border-radius: 8px; margin-top: 18px; line-height: 1.7; font-size: 14px; }
        .message[hidden] { display: none; }
        .message.success { background: #f0fdf4; border-left: 4px solid #16a34a; color: #166534; }
        .message.error { background: #fef2f2; border-left: 4px solid #dc2626; color: #991b1b; }
        body { background: #f3f4f6; }
        .container { width: min(100%, 626px); max-width: 626px; min-height: 100vh; padding: 0; }
        .header { background: #1f2937; color: #fff; padding: 24px 25px; }
        .back { color: #fff; font-size: 16px; }
        .header h1 { margin: 24px 0 0; font-size: 28px; line-height: 1.25; }
        .subtitle { color: #d1d5db; margin: 6px 0 0; font-size: 18px; }
        .content { padding: 25px; }
        .info { background: #f3f4f6; padding: 18px 20px; border-radius: 12px; margin-bottom: 24px; line-height: 1.7; font-size: 18px; }
        .form-box { border: 0; border-radius: 0; padding: 0; }
        .field-label, fieldset legend { margin-bottom: 10px; font-size: 18px; }
        input[type="text"] { min-height: 56px; padding: 14px 16px; border-color: #cbd5e1; border-radius: 10px; font-size: 18px; margin-bottom: 22px; }
        fieldset { border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px 18px; margin-bottom: 22px; }
        .radio-option { min-height: 48px; display: flex; align-items: center; background: transparent; border: 0; padding: 10px 0; margin: 0; border-radius: 0; font-size: 18px; }
        .radio-option:hover { background: transparent; }
        .radio-option input { flex: 0 0 auto; margin: 0 14px 0 0; width: 21px; height: 21px; }
        button { min-height: 56px; border-radius: 10px; font-size: 18px; }
        @media (max-width: 600px) {
            .container { width: 100%; max-width: none; }
            .header { padding: 22px 20px; }
            .content { padding: 20px; }
            .info, .field-label, fieldset legend, .radio-option { font-size: 16px; }
        }
            /* Ukuran frame seragam untuk semua halaman e-learning */
        .app, .container {
            width: min(100%, 626px);
            max-width: 626px;
            min-height: 100vh;
            margin-left: auto;
            margin-right: auto;
        }
        .bottom-menu { max-width: 626px; }
        @media (max-width: 626px) {
            .app, .container { width: 100%; max-width: 100%; }
            .bottom-menu { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="pertemuan2.html" class="back">← Kembali</a>
            <h1>🧑‍🎓 Absensi</h1>
            <p class="subtitle">Pertemuan 2 - Invers Matriks</p>
        </header>

        <main class="content">

        <section class="info" aria-label="Informasi pertemuan">
            <strong>Mata Pelajaran:</strong> Matematika<br>
            <strong>Kelas:</strong> X SMA<br>
            <strong>Pertemuan:</strong> 2<br>
            <strong>Materi:</strong> Invers Matriks
        </section>

        <section class="form-box" aria-label="Formulir absensi">
            <form id="absensiForm" novalidate>
                <label class="field-label" for="nama">Nama siswa</label>
                <input type="text" id="nama" name="nama" autocomplete="name" readonly required>

                <fieldset>
                    <legend>Status kehadiran</legend>
                    <label class="radio-option">
                        <input type="radio" name="status" value="Hadir" required>
                        <span>Hadir</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="status" value="Izin">
                        <span>Izin</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="status" value="Sakit">
                        <span>Sakit</span>
                    </label>
                </fieldset>

                <button type="submit">SIMPAN ABSENSI</button>
            </form>

            <div class="message" id="message" role="status" aria-live="polite" hidden></div>
        </section>
        </main>
    </div>

    <script>
        (function () {
            const form = document.getElementById("absensiForm");
            const namaInput = document.getElementById("nama");
            const message = document.getElementById("message");
            const submitButton = form.querySelector('button[type="submit"]');
            let namaSiswa = "";

            function showMessage(text, isError) {
                message.textContent = text;
                message.className = "message " + (isError ? "error" : "success");
                message.hidden = false;
                message.setAttribute("role", isError ? "alert" : "status");
            }

            try {
                namaSiswa = (localStorage.getItem("namaSiswa") || "").trim();
            } catch (error) {
                showMessage("Browser tidak dapat membaca data pengguna. Aktifkan penyimpanan situs, lalu coba lagi.", true);
                submitButton.disabled = true;
                return;
            }

            if (!namaSiswa) {
                window.location.replace("index.html");
                return;
            }
            namaInput.value = namaSiswa;

            form.addEventListener("submit", function (event) {
                event.preventDefault();
                const statusTerpilih = form.querySelector('input[name="status"]:checked');

                if (!statusTerpilih) {
                    showMessage("Silakan pilih status kehadiran terlebih dahulu.", true);
                    form.querySelector('input[name="status"]').focus();
                    return;
                }

                const dataAbsensi = {
                    nama: namaSiswa,
                    status: statusTerpilih.value,
                    pertemuan: 2,
                    materi: "Invers Matriks",
                    waktu: new Date().toISOString()
                };

                try {
                    localStorage.setItem("absensiPertemuan2", JSON.stringify(dataAbsensi));
                    form.hidden = true;
                    showMessage(
                        "✅ Absensi berhasil disimpan. Nama: " + dataAbsensi.nama +
                        ". Status: " + dataAbsensi.status + ". Pertemuan: 2.",
                        false
                    );
                } catch (error) {
                    showMessage("Absensi belum dapat disimpan. Periksa pengaturan penyimpanan browser, lalu coba lagi.", true);
                }
            });
        })();
    </script>
</body>
</html>
