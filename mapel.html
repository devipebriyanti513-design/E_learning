<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f2937">
    <title>Matematika - E-Learning SMA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f6f8; color: #222; }
        .app { max-width: 500px; min-height: 100vh; margin: auto; background: #fff; padding-bottom: 30px; }
        header { background: #1f2937; color: #fff; padding: 20px; }
        header a { color: #fff; text-decoration: none; }
        header a:focus-visible, .button:focus-visible { outline: 3px solid #94a3b8; outline-offset: 3px; }
        header h1 { margin-top: 15px; font-size: 24px; }
        header p { margin-top: 5px; color: #d1d5db; }
        main { padding: 20px; }
        main > h2 { font-size: 20px; margin-bottom: 14px; }
        .notice { padding: 12px 14px; margin-bottom: 14px; border-radius: 8px; background: #eff6ff; color: #1e40af; line-height: 1.5; }
        .notice[hidden] { display: none; }
        .meeting { border: 1px solid #ddd; border-radius: 12px; padding: 18px; margin-top: 15px; }
        .meeting h3 { margin-bottom: 8px; }
        .meeting p { color: #555; margin-bottom: 12px; }
        .status { display: block; margin: 10px 0; font-size: 14px; font-weight: bold; }
        .status.complete { color: #166534; }
        .status.incomplete { color: #666; }
        .status.locked { color: #92400e; }
        .button { display: block; text-align: center; background: #1f2937; color: #fff; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .button:hover { background: #111827; }
        .button[aria-disabled="true"] { background: #9ca3af; cursor: pointer; }
            /* Ukuran frame seragam untuk semua halaman e-learning */
        .app, .container {
            width: min(100%, 626px);
            max-width: 626px;
            min-height: 100vh;
            margin-left: auto;
            margin-right: auto;
        }
        .bottom-menu { max-width: 626px; }
        @media (max-width: 626px) {
            .app, .container { width: 100%; max-width: 100%; }
            .bottom-menu { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <a href="dashboard.html">← Kembali</a>
            <h1>📐 Matematika</h1>
            <p>Kelas X SMA</p>
        </header>

        <main>
            <h2>Pertemuan</h2>
            <p class="notice" id="lockNotice" role="status" aria-live="polite" hidden></p>
            <p class="notice" id="storageNotice" role="alert" hidden></p>

            <section class="meeting" aria-labelledby="judul1">
                <h3 id="judul1">Pertemuan 1</h3>
                <p>Determinan Matriks</p>
                <span id="status1" class="status incomplete">Belum selesai</span>
                <a href="pertemuan.html" class="button">MULAI</a>
            </section>

            <section class="meeting" aria-labelledby="judul2">
                <h3 id="judul2">Pertemuan 2</h3>
                <p>Invers Matriks</p>
                <span id="status2" class="status incomplete">Belum selesai</span>
                <a href="pertemuan2.html" class="button" id="btnPertemuan2">MULAI</a>
            </section>

            <section class="meeting" aria-labelledby="judul3">
                <h3 id="judul3">Pertemuan 3</h3>
                <p>Penerapan Determinan dan Invers Matriks</p>
                <span id="status3" class="status incomplete">Belum selesai</span>
                <a href="pertemuan3.html" class="button" id="btnPertemuan3">MULAI</a>
            </section>
        </main>
    </div>

    <script>
        (function () {
            const notice = document.getElementById("lockNotice");
            const storageNotice = document.getElementById("storageNotice");

            function isMeetingComplete(number) {
                const keys = [
                    "absensiPertemuan" + number,
                    "tugasPertemuan" + number,
                    "quizPertemuan" + number
                ];

                return keys.every(function (key) {
                    return Boolean(localStorage.getItem(key));
                });
            }

            function setStatus(number, isComplete) {
                const status = document.getElementById("status" + number);
                status.textContent = isComplete ? "✓ Selesai" : "Belum selesai";
                status.className = "status " + (isComplete ? "complete" : "incomplete");
            }

            function lockMeeting(link, message) {
                link.setAttribute("aria-disabled", "true");
                link.addEventListener("click", function (event) {
                    event.preventDefault();
                    notice.textContent = message;
                    notice.hidden = false;
                    notice.scrollIntoView({ behavior: "smooth", block: "nearest" });
                });
            }

            try {
                const namaSiswa = (localStorage.getItem("namaSiswa") || "").trim();

                if (!namaSiswa) {
                    window.location.replace("index.html");
                    return;
                }

                const selesai1 = isMeetingComplete(1);
                const selesai2 = isMeetingComplete(2);
                const selesai3 = isMeetingComplete(3);

                setStatus(1, selesai1);
                setStatus(2, selesai2);
                setStatus(3, selesai3);
                }

                if (!selesai1 || !selesai2) {
                    document.getElementById("status3").textContent =
                        "🔒 Selesaikan pertemuan 1 dan 2 untuk membuka";
                    document.getElementById("status3").className = "status locked";

                    lockMeeting(
                        document.getElementById("btnPertemuan3"),
                        "Selesaikan absensi, tugas, dan kuis pertemuan 1 dan 2 terlebih dahulu."
                    );
                }
            } catch (error) {
                storageNotice.textContent =
                    "Data progress tidak bisa dibaca dari browser. Pastikan penyimpanan situs diaktifkan.";
                storageNotice.hidden = false;
            }
        })();
    </script>
</body>
</html>
