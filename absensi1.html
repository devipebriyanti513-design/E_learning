<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f2937">
    <title>Absensi Pertemuan 1 - E-Learning SMA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f6f8; color: #222; }
        .app { max-width: 500px; min-height: 100vh; margin: auto; background: #fff; padding-bottom: 30px; }
        header { background: #1f2937; color: #fff; padding: 20px; }
        header a { color: #fff; text-decoration: none; font-size: 16px; }
        header a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #64748b; outline-offset: 3px; }
        header h1 { margin-top: 20px; font-size: 25px; }
        header p { margin-top: 8px; color: #d1d5db; }
        main { padding: 20px; }
        .info { background: #f9fafb; border: 1px solid #ddd; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .info p { margin-bottom: 7px; }
        .info p:last-child { margin-bottom: 0; }
        .form-group { margin-bottom: 20px; }
        .form-group > label, fieldset legend { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="text"] { width: 100%; padding: 14px; border: 1px solid #ccc; border-radius: 9px; font-size: 16px; }
        input[readonly] { background: #f3f4f6; color: #444; }
        fieldset { border: 0; min-width: 0; }
        .status-option { display: flex; align-items: center; border: 1px solid #ddd; border-radius: 10px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
        .status-option:hover { background: #f9fafb; }
        .status-option input { width: 18px; height: 18px; margin-right: 12px; accent-color: #1f2937; }
        .button { width: 100%; border: 0; background: #1f2937; color: #fff; padding: 14px; border-radius: 9px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .button:hover { background: #111827; }
        .message { margin-top: 20px; padding: 15px; border-radius: 10px; line-height: 1.6; }
        .message[hidden] { display: none; }
        .message.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
        .message.error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
        /* Match the centered attendance layout used on Absensi Pertemuan 3. */
        body { background: #f3f4f6; }
        .app { width: min(100%, 626px); max-width: 626px; min-height: 100vh; padding-bottom: 32px; }
        header { padding: 24px 25px; }
        header a { font-size: 16px; }
        header h1 { margin-top: 24px; font-size: 28px; }
        header p { margin-top: 6px; font-size: 18px; }
        main { padding: 25px; }
        .info { background: #f3f4f6; border: 0; border-radius: 12px; padding: 18px 20px; margin-bottom: 24px; line-height: 1.7; }
        .info p { margin-bottom: 0; font-size: 18px; }
        .form-group { margin-bottom: 22px; }
        .form-group > label, fieldset legend { margin-bottom: 10px; font-size: 18px; }
        input[type="text"] { min-height: 56px; padding: 14px 16px; border-color: #cbd5e1; border-radius: 10px; font-size: 18px; }
        fieldset { border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px 18px; }
        .status-option { min-height: 48px; border: 0; border-radius: 0; padding: 10px 0; margin: 0; font-size: 18px; }
        .status-option:hover { background: transparent; }
        .status-option input { width: 21px; height: 21px; margin-right: 14px; }
        .button { min-height: 56px; border-radius: 10px; font-size: 18px; }
        @media (max-width: 600px) {
            .app { width: 100%; max-width: none; }
            header { padding: 22px 20px; }
            main { padding: 20px; }
            .info p, .form-group > label, fieldset legend, .status-option { font-size: 16px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
            /* Ukuran frame seragam untuk semua halaman e-learning */
        .app, .container {
            width: min(100%, 626px);
            max-width: 626px;
            min-height: 100vh;
            margin-left: auto;
            margin-right: auto;
        }
        .bottom-menu { max-width: 626px; }
        @media (max-width: 626px) {
            .app, .container { width: 100%; max-width: 100%; }
            .bottom-menu { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <a href="pertemuan.html">← Kembali</a>
            <h1>🧑‍🎓 Absensi</h1>
            <p>Pertemuan 1 - Determinan Matriks</p>
        </header>

        <main>
            <section class="info" aria-label="Informasi pertemuan">
                <p><strong>Mata Pelajaran:</strong> Matematika</p>
                <p><strong>Kelas:</strong> X SMA</p>
                <p><strong>Pertemuan:</strong> 1</p>
                <p><strong>Materi:</strong> Determinan Matriks</p>
            </section>

            <form id="absensiForm" novalidate>
                <div class="form-group">
                    <label for="nama">Nama siswa</label>
                    <input type="text" id="nama" name="nama" autocomplete="name" readonly required>
                </div>

                <fieldset class="form-group">
                    <legend>Status kehadiran</legend>
                    <label class="status-option">
                        <input type="radio" name="status" value="Hadir" required>
                        <span>Hadir</span>
                    </label>
                    <label class="status-option">
                        <input type="radio" name="status" value="Izin">
                        <span>Izin</span>
                    </label>
                    <label class="status-option">
                        <input type="radio" name="status" value="Sakit">
                        <span>Sakit</span>
                    </label>
                </fieldset>

                <button class="button" type="submit">SIMPAN ABSENSI</button>
            </form>

            <div class="message" id="message" role="status" aria-live="polite" hidden></div>
        </main>
    </div>

    <script>
        (function () {
            const namaInput = document.getElementById("nama");
            const form = document.getElementById("absensiForm");
            const message = document.getElementById("message");

            let namaSiswa = "";
            try {
                namaSiswa = (localStorage.getItem("namaSiswa") || "").trim();
            } catch (error) {
                showMessage("Browser tidak dapat membaca data pengguna. Coba aktifkan penyimpanan situs.", true);
                form.querySelector("button").disabled = true;
                return;
            }

            if (!namaSiswa) {
                window.location.replace("index.html");
                return;
            }
            namaInput.value = namaSiswa;

            form.addEventListener("submit", function (event) {
                event.preventDefault();
                const selectedStatus = form.querySelector('input[name="status"]:checked');

                if (!selectedStatus) {
                    showMessage("Silakan pilih status kehadiran terlebih dahulu.", true);
                    form.querySelector('input[name="status"]').focus();
                    return;
                }

                const dataAbsensi = {
                    nama: namaSiswa,
                    status: selectedStatus.value,
                    pertemuan: 1,
                    waktu: new Date().toISOString()
                };

                try {
                    localStorage.setItem("absensiPertemuan1", JSON.stringify(dataAbsensi));
                    showMessage(
                        "Absensi berhasil disimpan. Nama: " + dataAbsensi.nama +
                        ". Status: " + dataAbsensi.status + ". Pertemuan: 1.",
                        false
                    );
                } catch (error) {
                    showMessage("Absensi belum dapat disimpan. Periksa pengaturan penyimpanan browser, lalu coba lagi.", true);
                }
            });

            function showMessage(text, isError) {
                message.textContent = text;
                message.className = "message " + (isError ? "error" : "success");
                message.hidden = false;
                message.setAttribute("role", isError ? "alert" : "status");
            }
        })();
    </script>
</body>
</html>
